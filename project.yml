name: AxiomTune
options:
  bundleIdPrefix: com.axiom.ff
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  AxiomTune:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes: ["Info.plist"]
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axiom.ff.axiomtune
        PRODUCT_NAME: AxiomTune
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  AxiomTune:
    build:
      targets:
        AxiomTune: all
    archive:
      targets:
        AxiomTune: all
